<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FD Rate Calculator</title>
</head>
<body>
   <div id="wrapper">
    <h1>FD Rate Calculator</h1>
    <div class="inputdiv">
        <input type="text" id="input" placeholder="tenure months">
    </div>
    <div>
        <button type="submit" onclick="fdRate()">Calculate</button>
    </div>
    <div id="result">

    </div>
   </div> 
   <script>

    //else if ladder
    //<3 months - 5.8%
    // 3 - 6 months - 6.5%
    // 7 - 9 months - 6.8%
    // >=10 months - 7%
    function fdRate(){
        const months= Number(document.getElementById("input").value)
        // console.log(months)
        let rate = 0
        if(months<3)
            rate = 5.8
        else if(months>=3 && months<=6)
            rate = 6.5
        else if(months>=7 && months<=9 )
            rate = 6.8
        else
            rate = 7

        let result = document.getElementById("result")
        result.innerHTML = `Your Interest Rate is ${rate}%`

   
   
    }

    </script>
</body>
</html>
