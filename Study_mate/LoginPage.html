<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study_Buddy</title>
    <style>
        ul {
          list-style-type: none;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background-color: #333333;
        }
        
        li {
          float: left;
        }
        
        li a {
          display: block;
          color: white;
          text-align: center;
          padding: 16px;
          text-decoration: none;
        }
        
        li a:hover {
          background-color: #111111;
        }
        </style>
</head>
<body style = "background-color:#111111; color: antiquewhite;">

   <center>

        <ul style="background-color: whitesmoke; height:25px;">
            <li style="float: left"> 
                <select name="tutorials" id="tutorials" style="height: 25px; font-weight:bold ;">
                    <option>Tutorials</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="Bootsrtrap">Bootstrap</option>
                    <option value="Java">Java</option>
                </select>
            </li>
            <li style="float: left">
                <select name="exercise" id="exercise" style="height: 25px; color:black;font-weight: bold;">
                    <option >Exercises</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="Bootsrtrap">Bootstrap</option>
                    <option value="Java">Java</option>
                </select>
            </li>


        </ul>
        
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#course">Course</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="#about">About</a></li>
        </ul>
       <div> <h1>Welcome to Study Buddy!!!<br> Your Learning Partner</h1></div>
        
     <form action="UserPage.html" method="Get" >

        <div>
            <label for="email"></label>
            <input type="email" name="email" id="email" placeholder="Email Address" required>
        </div>
        <div>
            <input type="password" name="password" id="password" placeholder="password" required>
        </div>
        <div>
            <button type="submit" style="background-color: rgb(203, 51, 51); padding-left: 15px; padding-right: 15px; padding-top: 5px;padding-bottom: 5px; color: azure;">Login</button>
        </div>    
        <div style="text-align: center;">
            <input type="checkbox" name="Remember me" id="remember">
            <label for="remember">Remember me</label>
        </div>






    </form>
   </center>
    
</body>
</html>
